name: Preserve 0.5.19 test materials

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/preserve-test-materials.yml]
  workflow_run:
    workflows: ['PS5 test package (no release)']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  backup:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.id == 39928957729
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: 4fb91cc39ca4eed0e63a45f140c3296c8e21d2c3
      BUILD_WORKFLOW_COMMIT: da0759a53b9d8a8529ea3195052b6d87cc2be362
      BUILD_RUN: '39928957729'
    steps:
      - name: Fetch and preserve the exact work snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir source delivery provenance
          git -C source init
          git -C source remote add origin https://github.com/LoZazaMastro/Stremio-Plus.git
          git -C source fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          git -C source fetch --depth=1 origin 1475f4c66202325ff5bfde9e715e1dca4420a248
          git -C source diff 1475f4c66202325ff5bfde9e715e1dca4420a248 "$SOURCE_COMMIT" > provenance/login-source-changes.patch
          git -C source fetch --depth=1 origin "$BUILD_WORKFLOW_COMMIT"
          git -C source show "$BUILD_WORKFLOW_COMMIT:.github/workflows/ps5-test-build.yml" > provenance/ps5-test-build.yml
          git -C source fetch --depth=1 origin "$GITHUB_SHA"
          git -C source show "$GITHUB_SHA:.github/workflows/preserve-test-materials.yml" > provenance/preserve-test-materials.yml
          python3 - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          root = Path('source')
          cmake = root / 'CMakeLists.txt'
          text = cmake.read_text()
          old = 'project(stremio-ps5 VERSION 0.5.18 LANGUAGES C CXX)'
          assert text.count(old) == 1
          cmake.write_text(text.replace(old, 'project(stremio-ps5 VERSION 0.5.19 LANGUAGES C CXX)'))
          manifest = root / 'app/sce_sys/param.json'
          data = json.loads(manifest.read_text())
          assert data['titleId'] == 'PPSA74126' and data['contentVersion'] == '00.068.000'
          assert data['downloadDataSize'] == 0
          data['contentVersion'] = '00.069.000'
          data['creationDate'] = '2026-10-23'
          manifest.write_text(json.dumps(data, indent=2) + '\n')
          patch = subprocess.check_output(['git', '-C', 'source', 'diff', '--', 'CMakeLists.txt', 'app/sce_sys/param.json'])
          Path('provenance/test-build-version.patch').write_bytes(patch)
          handover = '''# Stremio Plus 0.5.19 TEST - independent work backup

          ## Identity and scope
          Source: 4fb91cc39ca4eed0e63a45f140c3296c8e21d2c3, based on released 0.5.18.
          Only CMake version and param.json metadata are adjusted to identify the
          newly compiled test binary as 0.5.19 / 00.069.000 / PPSA74126.
          The application source in this ZIP has that same metadata adjustment.

          Implemented: exchange device-code approval using loginWithToken and
          immediately persist the returned application session. Existing saved
          credentials are unchanged until a fresh sign-in.
          Not implemented: initial Home flicker, right-stick media volume, and
          firmware 12.7 microstutter. L2/R2 bindings are unchanged.
          No decoder, native memory, graphics or audio-lifetime safety code is
          removed by this work snapshot. No release or store submission is made.

          ## Validation
          First CI run 39927703365 compiled the host app, passed the account-link
          policy test with ASan/UBSan and passed 84 App/Tasks account checks.
          Its native build stopped at an unavailable OpenGL download (HTTP 404).
          The replacement build run is 39928957729. Its live/final status and
          artifacts, when available, are stored in the companion evidence bundle.
          None of these checks proves PS5 runtime stability or the real Stremio
          service's browser/device logout behavior. Test those on the console.
          Older WIP text in docs/ records the earlier unbuilt state; this handover
          and the dated CI evidence describe the current work.

          ## Rebuild without this chat
          Extract the source and dependency archives into the same directory.
          The application is in repository/Stremio-Plus. Keep all original notices.
          Follow BUILDING.md for Ubuntu 24.04 prerequisites. The exact automated
          commands, mirrors, metadata patch and checks are in provenance/.
          Do not apply test-build-version.patch again to the already adjusted source.

          Copy verified media archives from dependency-sources/media/ to
          repository/Stremio-Plus/.deps/vlc/dl/ before setup-vlc.sh.
          Copy the verified OpenGL archive to .deps/downloads/ under its original
          filename. The source SDK archive and binary SDK package are different
          things; their hashes are recorded separately in the source index.
          The pinned native boilerplate is retained under dependency-sources/
          boilerplate/ when available from the completed build cache, including
          its .git directory so the build can verify the original commit. Copy
          that directory to .deps/ps5-native-app-boilerplate. Otherwise recover
          exact revision f98de734b68b0b980d38ff03a330066afd6ae16d from the mirror
          named in provenance/ps5-test-build.yml; do not follow its latest branch.

          BUILD_JOBS=4 bash build.sh desktop
          python3 tests/run_account_tests.py build/desktop
          BUILD_JOBS=4 bash tools/setup-toolchain.sh
          BUILD_JOBS=4 bash tools/setup-vlc.sh
          BUILD_JOBS=4 bash native/build.sh PPSA74126 'Stremio Plus'
          The final command produces dist/PPSA74126.zip with executable modes.
          It does not create a release or upload to ProsperoStore.

          ## Console test
          Preserve /data/Stremio and all downloaded videos. Replace only the app
          while it is closed. Sign out in the app once, pair again, log out in the
          phone browser, refresh account data and restart the PS5 application.
          Record the actual version and retain logs. Do not publish untested code.

          ## Backup completeness
          The source ZIP is independent of the compile result. Dependency and
          symbol bundles are generated separately after the build finishes.
          INPUT-STATUS.json reports missing inputs instead of silently treating
          the backup as complete. Symbol presence alone is not proof of a signed
          runnable package; compare them with the matching build receipt.
          Save downloaded artifacts locally; GitHub Actions retention is temporary.
          '''
          # Strip YAML indentation retained in the multiline handover.
          handover = '\n'.join(line[10:] if line.startswith('          ') else line for line in handover.splitlines()) + '\n'
          Path('provenance/HANDOVER.md').write_text(handover)
          files = subprocess.check_output(['git', '-C', 'source', 'ls-files', '-z']).decode().split('\0')
          prefix = 'Stremio-Plus-0.5.19-source/'
          output = Path('delivery/Stremio-Plus-0.5.19-source.zip')
          hashes = {}
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for name in sorted(filter(None, files)):
                  p = root / name
                  assert p.is_file(), 'Missing tracked source: ' + name
                  z.write(p, prefix + 'repository/Stremio-Plus/' + name)
                  hashes[name] = hashlib.sha256(p.read_bytes()).hexdigest()
              for p in sorted(Path('provenance').rglob('*')):
                  if p.is_file(): z.write(p, prefix + p.as_posix())
              z.writestr(prefix + 'provenance/SOURCE-FILE-HASHES.json', json.dumps(hashes, indent=2) + '\n')
          with zipfile.ZipFile(output) as z:
              assert z.testzip() is None
              for name, expected in hashes.items():
                  assert hashlib.sha256(z.read(prefix + 'repository/Stremio-Plus/' + name)).hexdigest() == expected
          Path('delivery/SHA256SUMS-source.txt').write_text(hashlib.sha256(output.read_bytes()).hexdigest() + '  ' + output.name + '\n')
          print('Source ZIP verified:', len(hashes), 'files;', output.stat().st_size, 'bytes')
          PY

      - name: Upload source backup immediately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Stremio-Plus-0.5.19-source-backup
          path: delivery/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Restore the completed build cache for provenance and symbols
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            source/.deps
            source/build
          key: ps5-test-ubuntu24-clang18-v1-${{ env.SOURCE_COMMIT }}-${{ env.BUILD_RUN }}

      - name: Collect build evidence and dependency sources
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence collected/dependency-sources/media collected/dependency-sources/additional
          gh api "repos/LoZazaMastro/Stremio-Plus/actions/runs/$BUILD_RUN" > evidence/run.json
          gh api "repos/LoZazaMastro/Stremio-Plus/actions/runs/$BUILD_RUN/jobs?per_page=100" > evidence/jobs.json
          gh api "repos/LoZazaMastro/Stremio-Plus/actions/runs/$BUILD_RUN/artifacts?per_page=100" > evidence/artifacts.json
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, os, re, shutil, subprocess, zipfile
          from pathlib import Path
          root = Path('source')
          media = json.loads((root/'vendor/vlc-ps5/sources.json').read_text())['sources']
          docs = (root/'docs/DEPENDENCY_SOURCES.md').read_text()
          records = []
          for item in media:
              records.append(dict(item, category='media'))
          for line in docs.splitlines():
              if not line.startswith('|'): continue
              link = re.search(r'\]\((https://[^)]+)\)', line)
              sha = re.search(r'`([0-9a-f]{64})`', line)
              if not link or not sha: continue
              url = link.group(1)
              if 'ps5-native-app-boilerplate' in url: continue
              leaf = url.rsplit('/',1)[-1]
              if re.fullmatch('[0-9a-f]{40}', leaf):
                  project = url.split('/')[-3]
                  leaf = project + '-' + leaf + '.tar.gz'
              records.append({'filename':leaf, 'url':url, 'sha256':sha.group(1), 'category':'additional'})
          records += [
              {'filename':'ps5-opengl-sdk-1.0.0.tar.gz', 'url':'https://github.com/MyLuxy/overdrive-deps/releases/download/ps5-opengl-v1.0.0/ps5-opengl-sdk-1.0.0.tar.gz', 'sha256':'f93643c04c843d56143b00951df1f8042ea7706ae9f19e4e9abf158e1ead77c5', 'category':'additional'},
              {'filename':'zlib-1.3.2.tar.gz', 'url':'https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz', 'sha256':'bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16', 'category':'additional'}]
          def sha256(p):
              with p.open('rb') as f: return hashlib.file_digest(f, 'sha256').hexdigest()
          def obtain(item):
              dest = Path('collected/dependency-sources') / item['category'] / item['filename']
              assert dest.name == item['filename'] and '/' not in item['filename']
              choices = [root/'.deps/vlc/dl'/item['filename'], root/'source-archives'/item['filename'], root/'.deps/downloads'/item['filename']]
              for candidate in choices:
                  if candidate.is_file() and sha256(candidate) == item['sha256']:
                      shutil.copy2(candidate, dest)
                      return dict(item, status='verified', bytes=dest.stat().st_size)
              result = subprocess.run(['curl','-fLsS','--retry','2','--connect-timeout','15','--max-time','180',item['url'],'-o',str(dest)+'.part'], stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True)
              partial = Path(str(dest)+'.part')
              if result.returncode == 0 and partial.is_file() and sha256(partial) == item['sha256']:
                  partial.rename(dest)
                  return dict(item, status='verified', bytes=dest.stat().st_size)
              partial.unlink(missing_ok=True)
              return dict(item, status='missing-or-checksum-mismatch')
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results = list(pool.map(obtain, records))
          bp = root/'.deps/ps5-native-app-boilerplate'
          if not (bp/'.git').is_dir():
              bp.mkdir(parents=True, exist_ok=True)
              subprocess.run(['git','-C',str(bp),'init','-q'], check=True)
              subprocess.run(['git','-C',str(bp),'remote','add','origin','https://github.com/Phononenom/ps5-native-app-boilerplate.git'], check=True)
              subprocess.run(['git','-C',str(bp),'fetch','--depth=1','origin','f98de734b68b0b980d38ff03a330066afd6ae16d'], check=True)
              subprocess.run(['git','-C',str(bp),'checkout','--detach','FETCH_HEAD'], check=True)
          assert subprocess.check_output(['git','-C',str(bp),'rev-parse','HEAD'], text=True).strip() == 'f98de734b68b0b980d38ff03a330066afd6ae16d'
          subprocess.run(['git','-C',str(bp),'diff','--exit-code'], check=True)
          shutil.copytree(bp, Path('collected/dependency-sources/boilerplate'), ignore=shutil.ignore_patterns('.deps','build','build-*'), dirs_exist_ok=True)
          for name in ('ps5-payload-sdk-v0.42.zip','ps5-payload-dev-v0.40.2.tar.gz'):
              p = root/'.deps/downloads'/name
              if p.is_file():
                  out = Path('collected/toolchain-binary-inputs')
                  out.mkdir(exist_ok=True)
                  shutil.copy2(p, out/name)
          Path('collected/INPUT-STATUS.json').write_text(json.dumps({'source_commit':os.environ['SOURCE_COMMIT'], 'build_run':int(os.environ['BUILD_RUN']), 'all_listed_source_archives_verified':all(r['status']=='verified' for r in results), 'inputs':results}, indent=2)+'\n')
          assets = json.loads(Path('evidence/artifacts.json').read_text()).get('artifacts',[])
          for asset in assets:
              if asset['name'] not in ('Stremio-Plus-test-build-logs','Stremio-Plus-0.5.19-TEST-PPSA74126'): continue
              subprocess.run(['gh','run','download',os.environ['BUILD_RUN'],'--repo','LoZazaMastro/Stremio-Plus','--name',asset['name'],'--dir','evidence/'+asset['name']], check=True)
          native = root/'build/native'
          if native.is_dir():
              dst = Path('symbols/native'); dst.mkdir(parents=True,exist_ok=True)
              for pattern in ('*.elf','*.map','*.json','*.sha256','*.log','dependencies.txt'):
                  for p in native.glob(pattern):
                      if p.is_file(): shutil.copy2(p,dst/p.name)
          for p in (root/'.deps/vlc').glob('build-receipt-*.json'):
              shutil.copy2(p,Path('evidence')/p.name)
          for directory, name in [('collected','Stremio-Plus-0.5.19-dependency-source.zip'),('evidence','Stremio-Plus-0.5.19-build-evidence.zip'),('symbols','Stremio-Plus-0.5.19-symbols.zip')]:
              base = Path(directory)
              if not base.exists(): continue
              out = Path('delivery')/name
              with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=1) as z:
                  for p in sorted(base.rglob('*')):
                      if p.is_file(): z.write(p,'Stremio-Plus-0.5.19-source/'+p.relative_to(base).as_posix())
              with zipfile.ZipFile(out) as z: assert z.testzip() is None
          sums = ''.join(sha256(p)+'  '+p.name+'\n' for p in sorted(Path('delivery').glob('*.zip')))
          Path('delivery/SHA256SUMS.txt').write_text(sums)
          missing = [r['filename'] for r in results if r['status']!='verified']
          print('Dependency backup missing inputs:',json.dumps(missing))
          print(sums)
          PY

      - name: Upload collected materials even when a dependency is unavailable
        if: always() && (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Stremio-Plus-0.5.19-work-materials
          path: |
            delivery/
            collected/INPUT-STATUS.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
